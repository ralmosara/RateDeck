  api:
    build:
      context: ../../
      dockerfile: apps/api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgres://ratedeck_app:ratedeck_app@postgres:5432/ratedeck"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  db-setup:
    build:
      context: ../../
      dockerfile: apps/api/Dockerfile
    command: >
      sh -c "pnpm exec tsx scripts/migrate.ts && node dist/seed.js"
    environment:
      DATABASE_URL: "postgres://ratedeck:ratedeck@postgres:5432/ratedeck"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ../../
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/worker.js"]
    environment:
      DATABASE_URL: "postgres://ratedeck_app:ratedeck_app@postgres:5432/ratedeck"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ../../
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api

  rating-service:
    build:
      context: ../../
      dockerfile: apps/rating-service/Dockerfile
    environment:
      DATABASE_URL: "postgres://ratedeck_app:ratedeck_app@postgres:5432/ratedeck"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  auth-service:
    build:
      context: ../../
      dockerfile: apps/auth-service/Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: "postgres://ratedeck_app:ratedeck_app@postgres:5432/ratedeck"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  clickhouse:
    image: clickhouse/clickhouse-server
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3002:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  redisdata:
  miniodata:
  clickhouse_data:
